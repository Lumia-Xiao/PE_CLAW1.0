[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-claw-gui"
version = "0.1.0"
description = "PE-Claw multi-topology scaffold with an active Buck CCM flow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pe_claw_gui = ["libraries/semiconductors/infineon/data/*.xml"]
