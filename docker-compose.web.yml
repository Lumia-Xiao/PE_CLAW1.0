services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pe_claw
      POSTGRES_USER: pe_claw
      POSTGRES_PASSWORD: ${PE_CLAW_POSTGRES_PASSWORD:?set PE_CLAW_POSTGRES_PASSWORD}
    volumes: ["pe-claw-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pe_claw -d pe_claw"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["pe-claw-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    command: ["python", "-m", "uvicorn", "pe_claw_web.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PE_CLAW_DATABASE_URL: postgresql+psycopg://pe_claw:${PE_CLAW_POSTGRES_PASSWORD}@postgres:5432/pe_claw
      PE_CLAW_REDIS_URL: redis://redis:6379/0
      PE_CLAW_ARTIFACT_ROOT: /data/artifacts
    volumes: ["pe-claw-artifacts:/data/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: ["python", "-m", "celery", "-A", "pe_claw_web.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    environment:
      PE_CLAW_DATABASE_URL: postgresql+psycopg://pe_claw:${PE_CLAW_POSTGRES_PASSWORD}@postgres:5432/pe_claw
      PE_CLAW_REDIS_URL: redis://redis:6379/0
      PE_CLAW_ARTIFACT_ROOT: /data/artifacts
    volumes: ["pe-claw-artifacts:/data/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  pe-claw-postgres:
  pe-claw-redis:
  pe-claw-artifacts:
